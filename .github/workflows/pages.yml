# THE DEPLOY — the three demos as a static site on GitHub Pages.
#
# This repository depends on `vizfootprint` through `file:` links to a SIBLING
# checkout, so the job's first act is to put that sibling where the links say
# it is. Nothing here resolves from the npm registry: the library is public on
# GitHub and is not published to npm, which is why the checkout is the install.
#
# The order is the same one README.md gives a person cloning by hand:
#   1. the three repositories, side by side under the same parent
#   2. the library: install, build, build the ui, build the studio
#      (studio is a workspace of its own — `build:ui` does not reach it)
#   3. storydeck: install (it ships source, not a build, but still needs its
#      own dependency installed into its own node_modules — see below)
#   4. this repo: install, build the site
#   5. publish dist/site
#
# PINNED REFS — the library and storydeck checkouts below name an explicit
# commit rather than floating on `main`. Neither is published to npm, so this
# workflow's checkout IS the install; without a pin, a commit landing on
# either sibling's `main` between one run and the next would change what this
# demo builds from without a single line changing here, and a broken build
# would point at the wrong repository. Bump the two SHAs by hand — with this
# file, in its own commit — when the demo means to move to newer library code.
#
# `SITE_BASE` is NOT hardcoded here: `web/site.vite.config.ts` defaults it to
# `/vizfootprint-demo/` (the local working-copy name, singular), but this repo
# is published as `vizfootprint-demos` (plural) — a different path. Rather
# than hardcode a second name that could drift from the first, the build step
# below reads `configure-pages`'s own `base_path` output, so the site is
# always mounted at wherever this repository actually is.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: check out this repository
        uses: actions/checkout@v4
        with:
          path: vizfootprint-demo

      # the `file:` sibling, at the path package.json names.
      # Pinned: not published to npm, so this checkout is the install, and an
      # unpinned `main` could change under this workflow's feet.
      - name: check out the library beside it
        uses: actions/checkout@v4
        with:
          repository: footprintjs/vizfootprint
          ref: d6081033d3f7ea18ffa9befea92d9e2f097d0940
          path: vizfootprint

      # the Story tab's scroll lens, the third `file:` sibling — `npm install`
      # refuses without it, because package.json names it a dependency.
      # Pinned for the same reason as the library above.
      - name: check out storydeck beside them
        uses: actions/checkout@v4
        with:
          repository: footprintjs/storydeck
          ref: 246d187467d8ca9d20e94b9901f5ad06faf104f9
          path: storydeck

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # runs before the build so its `base_path` output can tell the build
      # where this site is actually mounted
      - id: pages
        uses: actions/configure-pages@v5

      - name: build the library, its ui and its studio
        working-directory: vizfootprint
        run: |
          npm install
          npm run build
          npm run build:ui
          npm run build -w vizfootprint-studio

      # storydeck ships raw source (no build script) but still carries its own
      # runtime dependency (markdown-it) in its own node_modules — it is a
      # `file:` sibling, not a workspace of either side, so nothing else here
      # installs that for it, and the site build fails to resolve the import
      # without this step.
      - name: install storydeck's own dependencies
        working-directory: storydeck
        run: npm install

      - name: build the site
        working-directory: vizfootprint-demo
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm install
          npm run site:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vizfootprint-demo/dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
